spring:
  application:
    name: backend
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "hobist:"

server:
  servlet:
    context-path: /api/v1/

jwt:
  secret: ${JWT_PASSWORD}
  expiration: 3600000

frontend:
  address: ${FRONTEND_ADDRESS}
